repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # The uv lock file is larger than the 500 kB default.
        args: [--maxkb=1024, --enforce-all]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  # ruff and check_pins run from the project environment (`uv sync --group
  # lint`), so the ruff version has one source: the lint dependency group.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: check-pins
        name: check that duplicated pins agree
        entry: uv run --no-sync python scripts/check_pins.py
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      # Upstream entry: the staged changes, at commit time.
      - id: gitleaks
      # The staged scan finds nothing on a clean checkout such as CI's, so a
      # second run scans every reachable commit.
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets in the git history
        entry: gitleaks git --redact --verbose

  - repo: https://github.com/Yelp/detect-secrets
    rev: 01886c8a910c64595c47f186ca1ffc0b77fa5458 # frozen: v1.5.0
    hooks:
      - id: detect-secrets
        # Hook revisions and the setup-uv checksums are hex digests, which the
        # hex entropy plugin flags; check_pins already pins the checksums.
        args:
          - --baseline
          - .secrets.baseline
          - --exclude-lines
          - "# frozen: v"
          - --exclude-lines
          - 'checksum: "[0-9a-f]{64}"'

  - repo: https://github.com/crate-ci/typos
    rev: b859c0df7f391deba73030f79b957e62b4d81dc6 # frozen: varcon-core-v5.0.7
    hooks:
      - id: typos
        # Report only. The upstream args include --write-changes.
        args: [--force-exclude]

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # frozen: v1.32.0
    hooks:
      - id: zizmor
