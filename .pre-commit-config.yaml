repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # The uv lock file is larger than the 500 kB default.
        args: [--maxkb=1024, --enforce-all]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  # ruff and check_pins run from the project environment (`uv sync --group
  # lint`), so the ruff version has one source: the lint dependency group.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: check-pins
        name: check that duplicated pins agree
        entry: uv run --no-sync python scripts/check_pins.py
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
        # The upstream entry scans only staged changes, which finds nothing on
        # a clean checkout. Scan every reachable commit instead.
        entry: gitleaks git --redact --verbose

  - repo: https://github.com/Yelp/detect-secrets
    rev: 01886c8a910c64595c47f186ca1ffc0b77fa5458 # frozen: v1.5.0
    hooks:
      - id: detect-secrets
        # Hook revisions are commit SHAs, which the hex entropy plugin flags.
        args: [--baseline, .secrets.baseline, --exclude-lines, "# frozen: v"]

  - repo: https://github.com/crate-ci/typos
    rev: 4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # frozen: v1.52.0
    hooks:
      - id: typos
        # Report only. The upstream args include --write-changes.
        args: [--force-exclude]

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # frozen: v1.32.0
    hooks:
      - id: zizmor
