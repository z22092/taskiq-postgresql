# Local PostgreSQL for manual development. The test suite starts its own
# container through testcontainers and does not need this file.
#
#   docker compose up -d --wait
#   export POSTGRESQL_URL=postgresql://postgres@localhost:5432/postgres
services:
  postgres:
    image: postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      # Dev only: no password, so the passwordless DSN above works. Safe
      # because the port below is bound to the loopback interface.
      POSTGRES_HOST_AUTH_METHOD: trust

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

    networks:
      - default

volumes:
  postgres_data:
networks:
  default:
    driver: bridge
