# Local PostgreSQL for manual development. The test suite starts its own
# container through testcontainers and does not need this file.
#
#   docker compose up -d --wait
#   export POSTGRESQL_URL=postgresql://postgres@localhost:5432/postgres
services:
  postgres:
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      # Dev only: no password, so the passwordless DSN above works. Safe
      # because the port below is bound to the loopback interface.
      POSTGRES_HOST_AUTH_METHOD: trust

    volumes:
      # PostgreSQL 18 images keep the cluster under /var/lib/postgresql/<major>/
      # and declare /var/lib/postgresql as the volume; mounting the old
      # /var/lib/postgresql/data path makes the image refuse to start.
      - postgres_data:/var/lib/postgresql

    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

    networks:
      - default

volumes:
  postgres_data:
networks:
  default:
    driver: bridge
