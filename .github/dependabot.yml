version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "build(deps)"

  # Hook revisions are SHA-pinned with a "# frozen: vX" comment.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    # The typos repository also tags its sibling crates, and Dependabot reads
    # "varcon-core-v4.0.10" as typos 4.0.10 (a 2024 commit, older than
    # v1.52.0). varcon-core has tags from 2.0.0 upwards, so any typos version
    # at 2 or above is ambiguous; a real typos 2.x is bumped by hand. The
    # dependency name is the repository URL.
    ignore:
      - dependency-name: "https://github.com/crate-ci/typos"
        versions: [">=2"]
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"

  # The only container images are the PostgreSQL ones in docker-compose.yml
  # (the default service and the pg17 profile); the "docker" ecosystem reads
  # Dockerfiles, not compose files.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    # Majors are added deliberately, in the compose file and in
    # tests/conftest.py together; Dependabot only moves the pins within a major.
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
    groups:
      docker-images:
        patterns:
          - "*"
    commit-message:
      prefix: "build(deps)"
