version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "build(deps)"

  # Hook revisions are SHA-pinned with a "# frozen: vX" comment.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    # Dependabot picked the commit tagged "varcon-core-v5.0.7", a sibling crate
    # of the same repository, as a typos release. Real typos releases are 1.x,
    # so nothing >=2 can be a typos release. The dependency name is the
    # repository URL.
    ignore:
      - dependency-name: "https://github.com/crate-ci/typos"
        versions: [">=2"]
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"

  # The only container image is the PostgreSQL one in docker-compose.yml;
  # the "docker" ecosystem reads Dockerfiles, not compose files.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      docker-images:
        patterns:
          - "*"
    commit-message:
      prefix: "build(deps)"
