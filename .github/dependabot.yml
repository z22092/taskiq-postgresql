version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "build(deps)"

  # Hook revisions are SHA-pinned with a "# frozen: vX" comment.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    # Dependabot parsed the commit tagged "varcon-core-v5.0.7", a sibling crate
    # of the same repository, as typos 5.0.7. Real typos releases are still
    # below 5, so a genuine 2.x-4.x release must keep being proposed. The
    # dependency name is the repository URL.
    ignore:
      - dependency-name: "https://github.com/crate-ci/typos"
        versions: [">=5"]
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"

  # The only container images are the PostgreSQL ones in docker-compose.yml
  # (the default service and the pg17 profile); the "docker" ecosystem reads
  # Dockerfiles, not compose files.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    # Majors are added deliberately, in the compose file and in
    # tests/conftest.py together; Dependabot only moves the pins within a major.
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
    groups:
      docker-images:
        patterns:
          - "*"
    commit-message:
      prefix: "build(deps)"
