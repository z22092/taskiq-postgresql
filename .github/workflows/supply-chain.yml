name: Supply chain

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          checksum: "c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83" # uv linux x86_64 archive; setup-uv ships no checksum for 0.13.7
          enable-cache: false
      - name: Export the locked runtime, extras and every dependency group with hashes
        run: uv export --locked --all-extras --all-groups --no-emit-project --output-file "$RUNNER_TEMP/audit-requirements.txt"
      # Only the audit group is installed; pip-audit never imports what it
      # audits. It skips pins whose markers exclude this interpreter, so pins
      # used only on Python 3.10 are not covered here.
      - name: Audit them against the PyPI/OSV advisory databases
        run: uv run --locked --only-group audit pip-audit --strict --disable-pip --require-hashes --requirement "$RUNNER_TEMP/audit-requirements.txt"
