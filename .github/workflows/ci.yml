name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Python comes from .python-version wherever no version is given.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the whole history

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      # The ruff and check_pins hooks run from this environment.
      - name: Install the lint group
        run: uv sync --locked --group lint

      - name: Run pre-commit on every file
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Ryuk, the testcontainers reaper, pulls an extra image from Docker Hub.
      # The runner VM is thrown away after the job, so nothing needs reaping.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python-version }}

      # The suite parametrizes every test over the three drivers, so all
      # extras are installed. A single-driver install fails on the others.
      - name: Install dependencies
        run: uv sync --locked --all-extras --group dev

      # No POSTGRESQL_URL: the suite starts PostgreSQL with testcontainers on
      # the runner's Docker.
      - name: Run the test suite
        run: uv run --no-sync pytest --cov=taskiq_postgresql --cov-report=xml --cov-report=term-missing

      - name: Keep the coverage report for the upload job
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1

  test-lowest:
    name: test (py3.10, lowest-direct)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true" # see the test job
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.10"

      # The lock holds the highest resolution, so --locked cannot apply here.
      # uv re-resolves with the lowest version of every direct dependency and
      # rewrites uv.lock on the runner; that copy is discarded with the VM.
      # Transitive dependencies still resolve to their highest versions.
      - name: Run the test suite on the lowest direct dependencies
        run: uv run --resolution lowest-direct --all-extras --group dev pytest

  # The only job that gets an OIDC token. Fork PRs get none, so it is skipped
  # for them.
  coverage:
    name: coverage
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ./coverage.xml
          # Flip to true once the first upload shows up on codecov.io.
          fail_ci_if_error: false
