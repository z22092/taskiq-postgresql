name: CD

# pull_request: build and smoke-test the wheel, publish nothing.
# release: published: build, attest, smoke-test and publish to PyPI.
# workflow_dispatch: build, attest, smoke-test and publish to TestPyPI only.
on:
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Python comes from .python-version in every job.
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          checksum: "c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83" # uv linux x86_64 archive; setup-uv ships no checksum for 0.13.7
          enable-cache: false # release jobs never share a cache

      - name: Verify the lock is current
        run: uv sync --locked --no-default-groups --no-install-project

      # A release takes its version from the tag (v1.2.3 -> 1.2.3). Pull
      # requests and manual runs get a unique development version so the same
      # path is exercised and TestPyPI never sees a repeated version. uv writes
      # the canonical PEP 440 form (v0.05.0 -> 0.5.0), and that form is what
      # later jobs compare against. `--frozen` would print the lock's version.
      - name: Set the version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            version="${REF_NAME#v}"
          else
            version="0.0.0.dev${RUN_ID}"
          fi
          uv version --frozen "$version"
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Build the sdist and wheel
        run: uv build

      # Uploaded before any smoke test runs, so attest signs exactly what the
      # build produced and nothing a later step could have touched.
      - name: Upload the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: attest
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  # Installs the locked, hash-checked requirements and then the wheel with
  # --no-deps, so nothing is resolved at smoke time; uv pip check then fails
  # if that set does not satisfy the wheel's base dependencies (it does not
  # look at dependencies gated on an extra).
  smoke:
    name: smoke
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          checksum: "c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83" # uv linux x86_64 archive; setup-uv ships no checksum for 0.13.7
          enable-cache: false

      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Install the wheel from locked, hashed requirements
        run: |
          uv export --locked --no-emit-project --all-extras --no-default-groups --output-file "$RUNNER_TEMP/requirements.txt"
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke" --require-hashes --requirement "$RUNNER_TEMP/requirements.txt"
          uv pip install --python "$RUNNER_TEMP/smoke" --no-deps dist/*.whl
          uv pip check --python "$RUNNER_TEMP/smoke"

      # -I keeps the checkout's taskiq_postgresql/ off sys.path, so the import
      # can only come from the installed wheel.
      - name: Smoke-test the wheel
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          "$RUNNER_TEMP/smoke/bin/python" -I -c '
          import importlib.metadata
          import os

          import taskiq_postgresql

          installed = importlib.metadata.version("taskiq-postgresql")
          expected = os.environ["EXPECTED_VERSION"]
          assert installed == expected, (installed, expected)
          assert "site-packages" in taskiq_postgresql.__file__, taskiq_postgresql.__file__
          print("taskiq-postgresql", installed, "imports from", taskiq_postgresql.__file__)
          '

  publish-testpypi:
    name: publish-testpypi
    needs: [build, attest, smoke]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/taskiq-postgresql/
    permissions:
      id-token: write # trusted publishing
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  publish-pypi:
    name: publish-pypi
    needs: [build, attest, smoke]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/taskiq-postgresql/
    permissions:
      id-token: write # trusted publishing
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
