name: CD

# pull_request: build and smoke-test the distributions, publish nothing.
# release: published: build, attest and publish to PyPI.
# workflow_dispatch: build, attest and publish to TestPyPI only.
on:
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: false # release jobs never share a cache

      - name: Verify the lock is current
        run: uv sync --locked --no-default-groups --no-install-project

      # A release takes its version from the tag (v1.2.3 -> 1.2.3). Pull
      # requests and manual runs get a unique development version so the same
      # path is exercised and TestPyPI never sees a repeated version.
      - name: Set the version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            version="${REF_NAME#v}"
          else
            version="0.0.0.dev${RUN_ID}"
          fi
          uv version --frozen "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the sdist and wheel
        run: uv build

      - name: Smoke-test the wheel
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv run --no-project --isolated --python 3.13 --with ./dist/*.whl python -I -c '
          import importlib.metadata
          import os

          import taskiq_postgresql

          installed = importlib.metadata.version("taskiq-postgresql")
          expected = os.environ["EXPECTED_VERSION"]
          assert installed == expected, (installed, expected)
          print("taskiq-postgresql", installed, "imports from", taskiq_postgresql.__file__)
          '

      - name: Upload the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: attest
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  publish-testpypi:
    name: publish-testpypi
    needs: [build, attest]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/taskiq-postgresql/
    permissions:
      id-token: write # trusted publishing
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  publish-pypi:
    name: publish-pypi
    needs: [build, attest]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/taskiq-postgresql/
    permissions:
      id-token: write # trusted publishing
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
