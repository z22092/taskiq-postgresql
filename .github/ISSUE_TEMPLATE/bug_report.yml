name: Bug report
description: Report something that does not work as documented
title: "[BUG] "
labels: ["bug", "triage"]
assignees:
  - z22092

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        Please search the existing issues first. Do not paste connection
        strings with passwords, tokens or certificates anywhere in this form.
        For a security vulnerability, do not open an issue: follow
        [SECURITY.md](https://github.com/z22092/taskiq-postgresql/blob/main/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: taskiq-postgresql version
      description: Output of `pip show taskiq-postgresql` (or your lock file).
      placeholder: the version pip prints
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version`.
      placeholder: the version python prints
    validations:
      required: true

  - type: input
    id: taskiq-version
    attributes:
      label: taskiq version
      description: Output of `pip show taskiq`.
      placeholder: the version pip prints
    validations:
      required: true

  - type: dropdown
    id: driver
    attributes:
      label: PostgreSQL driver
      description: The `driver` argument you pass (the default is asyncpg).
      options:
        - asyncpg
        - psqlpy
        - psycopg
    validations:
      required: true

  - type: dropdown
    id: postgres-version
    attributes:
      label: PostgreSQL major version
      description: Result of `SHOW server_version;`. Versions 17 and 18 are the tested ones.
      options:
        - "18"
        - "17"
        - Other (state the version below)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected to see instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: >-
        The smallest script that shows the problem, with the DSN read from an
        environment variable. Say which component it touches (broker, result
        backend or scheduler source).
      render: python
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Full traceback or log lines. This is formatted as code, so no backticks are needed.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else that helps, such as the other PostgreSQL version if you chose "Other" above.
    validations:
      required: false
