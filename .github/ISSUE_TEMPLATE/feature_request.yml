name: Feature request
description: Suggest an improvement or a new capability
title: "[FEATURE] "
labels: ["enhancement", "triage"]
assignees:
  - z22092

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. For anything larger than a small
        change, an issue first lets us agree on the approach before you write
        code. Do not paste connection strings with passwords or tokens.

  - type: textarea
    id: problem-description
    attributes:
      label: Problem
      description: What is hard or impossible today, and why does it matter to you?
    validations:
      required: true

  - type: textarea
    id: solution-description
    attributes:
      label: Proposed solution
      description: How you would like it to work, including the public API you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you tried.
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: The part of the package this mainly affects.
      options:
        - Broker
        - Result backend
        - Scheduler source
        - Database drivers
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: driver
    attributes:
      label: PostgreSQL driver
      description: The driver this matters for, if it is driver specific.
      options:
        - All drivers
        - asyncpg
        - psqlpy
        - psycopg
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions you use
      description: taskiq-postgresql, taskiq, Python and PostgreSQL major version.
      placeholder: taskiq-postgresql, taskiq, Python and PostgreSQL versions
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example of the desired usage
      description: A short code sketch of how you would call it.
      render: python
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Links, prior art in other taskiq brokers, or anything else relevant.
    validations:
      required: false
