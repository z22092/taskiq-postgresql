[tool.hatch.build.targets.wheel]
packages = ["taskiq_postgresql"]


[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "alembic: the Alembic integration; CI also runs these on the oldest Alembic the extra allows",
]

# Applies whenever pytest runs with --cov (CI's test job does): a change that
# takes line coverage below fail_under fails; raise it when coverage rises.
# The total is compared at the report's precision, and the default of 0
# decimals would round 93.6% up to 94 and pass, so the report keeps two.
[tool.coverage.report]
fail_under = 94
precision = 2

# scripts/ stays out: check_pins.py imports tomllib, which ty rejects at the
# Python 3.10 floor although the script only ever runs on 3.13.
[tool.ty.src]
include = ["taskiq_postgresql"]

[tool.ruff.format]
exclude = [".venv/"]

[tool.ruff.lint]
select  = [
    "E",   # Error
    "F",   # Pyflakes
    "W",   # Pycodestyle
    "C90", # McCabe complexity
    "I",   # Isort
    "N",   # pep8-naming
    "D",   # Pydocstyle
    "ANN", # Pytype annotations
    "S",   # Bandit
    "B",   # Bugbear
    "COM", # Commas
    "C4",  # Comprehensions
    "ISC", # Implicit string concat
    "PIE", # Unnecessary code
    "T20", # Catch prints
    "PYI", # validate pyi files
    "Q",   # Checks for quotes
    "RSE", # Checks raise statements
    "RET", # Checks return statements
    "SLF", # Self checks
    "SIM", # Simplificator
    "PTH", # Pathlib checks
    "ERA", # Checks for commented out code
    "PL",  # PyLint checks
    "RUF", # Specific to Ruff checks
]
ignore = [
    "D105",    # Missing docstring in magic method
    "D107",    # Missing docstring in __init__
    "D212",    # Multi-line docstring summary should start at the first line
    "D401",    # First line should be in imperative mood
    "D104",    # Missing docstring in public package
    "D100",    # Missing docstring in public module
    "ANN401",  # typing.Any are disallowed in `**kwargs
    "PLR0913", # Too many arguments for function call
    "D106",    # Missing docstring in public nested class
    "COM812",  # Use of assert detected
    "PLR0917", # Too many positional args; fixing breaks public API callers
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["taskiq_dependencies.Depends", "taskiq.TaskiqDepends"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",   # Use of assert detected
    "S301",   # Use of pickle detected
    "D103",   # Missing docstring in public function
    "SLF001", # Private member accessed
    "S311",   # Standard pseudo-random generators are not suitable for security/cryptographic purposes
    "D101",   # Missing docstring in public class
]
"scripts/*" = [
    "T201",   # check_pins reports to stdout/stderr
]
