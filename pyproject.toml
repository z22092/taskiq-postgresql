[project]
name = "taskiq-postgresql"
version = "0.4.1"
description = "PostgreSQL integration for taskiq"
readme = "README.md"
authors = [
    { name = "Jefferson Venceslau", email = "jeff.venceslau@gmail.com" }
]
dependencies = [
    # taskiq 0.13's own floor; the package uses the pydantic v2 API directly.
    "pydantic>=2.5,<3",
    "taskiq>=0.11.7,<0.14",
    "typing-extensions>=4.0.0,<5",
]
license = "MIT"
requires-python = ">=3.10,<3.16"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Topic :: System :: Networking",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
keywords = [
    "taskiq",
    "tasks",
    "distributed",
    "async",
    "postgresql",
    "asyncpg",
    "psqlpy",
    "psycopg3",
]

[project.urls]
Homepage = "https://github.com/z22092/taskiq-postgresql"
Repository = "https://github.com/z22092/taskiq-postgresql"

[project.optional-dependencies]
asyncpg = [
    "asyncpg>=0.30.0,<0.33",
]

psqlpy = [
    "psqlpy>=0.11.3,<0.14",
]
psycopg = [
    "psycopg[binary,pool]>=3.2.9,<3.4",
]
# The integrations in taskiq_postgresql.contrib. Each extra names sqlalchemy
# itself, so its range is this package's whichever extra brings it.
sqlalchemy = [
    "sqlalchemy>=2.0.36,<2.1",
]
sqlmodel = [
    "sqlalchemy>=2.0.36,<2.1",
    "sqlmodel>=0.0.22,<0.1",
]
alembic = [
    "alembic>=1.14.0,<1.21",
    "sqlalchemy>=2.0.36,<2.1",
]
# The floor is the 5.2 patch the tests pin: 5.2 LTS is the oldest Django line
# the app supports, and the newest that runs on Python 3.10. The ceiling is
# the next minor of the newest locked Django, as for every runtime range.
# Django 6 needs Python 3.12, so on 3.10 and 3.11 the range resolves to 5.2.
django = [
    "django>=5.2.19,<6.2",
]

# `taskiq postgresql ...`: taskiq loads every taskiq_cli entry point.
[project.entry-points.taskiq_cli]
postgresql = "taskiq_postgresql.cli:PostgresqlCMD"

# The formats `taskiq postgresql generate --format` can render; other packages
# add theirs to the same group. A format's optional dependencies are the extra
# named after it.
[project.entry-points."taskiq_postgresql.migration_formats"]
sql = "taskiq_postgresql.migrations:sql_format"
alembic = "taskiq_postgresql.contrib.alembic:alembic_format"
django = "taskiq_postgresql.contrib.django_format:django_format"


[build-system]
# Pinned with sha256 in build-constraint-dependencies under [tool.uv].
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "pytest-timeout==2.4.0",
    "anyio==4.16.0",
    "testcontainers==4.15.0",
    # taskiq's MSGPackSerializer imports it; the README tests check that it
    # cannot store results.
    "msgpack==1.2.4",
    # One pin per Django line the extra allows: Django 6 needs Python 3.12.
    "django==5.2.19; python_version < \"3.12\"",
    "django==6.1.3; python_version >= \"3.12\"",
]
# pip-audit pulls filelock through cachecontrol[filecache]; the fixed
# filelock needs Python 3.11, so the audit tooling stays off 3.10.
audit = [
    "pip-audit==2.10.1; python_version >= \"3.11\"",
]
lint = [
    "ruff==0.17.4",
    "pre-commit==4.7.0; python_version >= \"3.11\"",
    "ty==0.0.99",
]
# The wheel ships the git-cliff binary, so the release tooling needs no Rust
# toolchain and the lock holds its hash like every other tool.
release = [
    "git-cliff==2.14.2",
]

[tool.uv]
managed = true
exclude-newer = "14 days"
required-version = ">=0.12.16,<=0.13.7"
